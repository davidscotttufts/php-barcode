name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    name: PHP ${{ matrix.php }}${{ matrix.lowest && ' (lowest deps)' || '' }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.3', '8.4', '8.5']
        lowest: [false]
        include:
          - php: '8.2'
            lowest: true
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: gd, mbstring, iconv, zlib
          coverage: none
      - uses: ramsey/composer-install@v3
        with:
          dependency-versions: ${{ matrix.lowest && 'lowest' || 'highest' }}
      - run: vendor/bin/phpunit

  scan:
    name: Decode generated barcodes with zxing-cpp
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: gd
      - uses: ramsey/composer-install@v3
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install zxing-cpp pillow
      - run: vendor/bin/phpunit --testsuite Integration
        env:
          BARCODE_DECODER: python3 tests/Integration/decode.py

  quality:
    name: Static analysis & code style
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: gd
      - uses: ramsey/composer-install@v3
      - run: vendor/bin/phpstan analyse --no-progress --memory-limit=1G
      - run: vendor/bin/php-cs-fixer fix --dry-run --diff
